# Runs .github/ci/checks.sh on every pull request and every push to main:
# bash syntax, shellcheck and the account-id check. The native installer's Go
# tests run in native.yaml.
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      with:
        persist-credentials: false
    - name: Install shellcheck
      run: .github/ci/install-shellcheck.sh
    - name: Checks
      run: .github/ci/checks.sh
