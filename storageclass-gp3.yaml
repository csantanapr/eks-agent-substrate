# The cluster's default StorageClass: encrypted gp3 EBS volumes from the EBS
# CSI driver, for every PVC that names no class. create-cluster.sh writes it
# to .work/storageclass.yaml with one tagSpecification_N parameter added for
# each tag (TAGS in config.env plus the owner tag), so every volume carries
# the tags, and applies that file. It has no placeholders.
#
# Learn more:
#   https://kubernetes.io/docs/concepts/storage/storage-classes/
#   https://docs.aws.amazon.com/eks/latest/userguide/ebs-csi.html

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
