# In-cluster LLM gateway: agentgateway with an Amazon Bedrock backend.
# - ClusterIP only; nothing outside the cluster can reach it.
# - Credentials: EKS Pod Identity on the llm-gateway ServiceAccount
#   (llm-gateway/deploy.sh). No keys in the pod, none in the actors.
# - Ingress: only atenet-egress (where actor traffic leaves the sandbox) and
#   the llm-gateway namespace itself (for smoke tests).
# - Actors speak the Anthropic Messages or OpenAI Chat Completions API and
#   send model "claude"; the gateway pins the Bedrock model.
apiVersion: v1
kind: Namespace
metadata:
  name: llm-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway
  namespace: llm-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: llm-gateway
data:
  config.yaml: |
    llm:
      port: 4000
      models:
      - name: claude
        provider: bedrock
        params:
          awsRegion: REPLACE_WITH_AWS_REGION
          model: REPLACE_WITH_INFERENCE_PROFILE
          bedrockEndpointPreference: runtimeOnly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: llm-gateway }
  template:
    metadata:
      labels: { app: llm-gateway }
    spec:
      serviceAccountName: llm-gateway
      nodeSelector: { ate.dev/pool: system }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: agentgateway
        image: cr.agentgateway.dev/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
        args: ["-f", "/config/config.yaml"]
        env:
        - { name: RUST_LOG, value: info }
        # Never fall back to the node's instance role through IMDS: the only
        # credential this pod may use is its Pod Identity role.
        - { name: AWS_EC2_METADATA_DISABLED, value: "true" }
        ports:
        - { name: llm, containerPort: 4000 }
        readinessProbe:
          tcpSocket: { port: 4000 }
          periodSeconds: 5
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { memory: 512Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        volumeMounts:
        - { name: config, mountPath: /config, readOnly: true }
        - { name: tmp, mountPath: /tmp }
      volumes:
      - name: config
        configMap: { name: llm-gateway-config }
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: llm-gateway
spec:
  type: ClusterIP
  selector: { app: llm-gateway }
  ports:
  - { name: http, port: 80, targetPort: llm }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-gateway-ingress
  namespace: llm-gateway
spec:
  podSelector: { matchLabels: { app: llm-gateway } }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ate-system } }
      podSelector: { matchLabels: { app: atenet-egress } }
    - podSelector: {}
    ports:
    - { port: 4000, protocol: TCP }
