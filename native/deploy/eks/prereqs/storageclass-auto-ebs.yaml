# A cluster prerequisite, applied before ate-setup runs: ate-setup v1.0.0
# deploys and waits on PostgreSQL before it applies the rest of the render,
# so this cannot ride in the overlay (GKE's dynamic-rwo is built in).
#
# The bundled PostgreSQL's volume on EKS Auto Mode. Auto Mode provisions EBS
# through its own driver, ebs.csi.eks.amazonaws.com, and its node autoscaler
# will not launch a node for a pod whose claim names any other provisioner
# (such as the ebs.csi.aws.com add-on's). The installer passes
# --ateapi-postgres-storage-class substrate-eks-auto-ebs on Auto Mode clusters,
# as substrate-gke passes dynamic-rwo on GKE.
#   https://docs.aws.amazon.com/eks/latest/userguide/create-storage-class.html
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: substrate-eks-auto-ebs
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
