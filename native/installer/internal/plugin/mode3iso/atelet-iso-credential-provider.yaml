# The kubelet image credential provider config atelet-iso uses on the
# isolated nodes. Auto Mode nodes run Bottlerocket, whose own config sets
# AWS_PROFILE=default, which fails inside a Pod with no ~/.aws. Without it the
# provider uses atelet's Pod Identity credentials, as on the other nodes.
#
# Learn more:
#   https://kubernetes.io/docs/tasks/administer-cluster/kubelet-credential-provider/
apiVersion: v1
kind: ConfigMap
metadata:
  name: atelet-iso-credential-provider
  namespace: ate-system
data:
  config.yaml: |
    apiVersion: kubelet.config.k8s.io/v1
    kind: CredentialProviderConfig
    providers:
      - name: ecr-credential-provider
        matchImages: ["*.dkr.ecr.*.amazonaws.com", "*.dkr.ecr.*.amazonaws.com.cn", "public.ecr.aws"]
        defaultCacheDuration: "12h"
        apiVersion: credentialprovider.kubelet.k8s.io/v1
