# In-cluster LLM gateway: agentgateway with an Amazon Bedrock backend.
# - ClusterIP only; nothing outside the cluster can reach it.
# - Credentials: EKS Pod Identity on the llm-gateway ServiceAccount
#   (`setup-aws plugin llm-gateway`). No keys in the pod, none in the actors.
# - Ingress: only atenet-egress (where actor traffic leaves the sandbox) and
#   the llm-gateway namespace itself (for smoke tests).
# - Actors speak the Anthropic Messages or OpenAI Chat Completions API and
#   send a model name: "claude" (the default), "claude-haiku",
#   "claude-sonnet" or "claude-opus". The gateway pins each to a Bedrock
#   inference profile.
#
# The llm-gateway plugin (llmgateway.go) applies it after filling in the
# region and the inference profile placeholders. It picks the newest Haiku,
# Sonnet and Opus profiles in the Region when it deploys.
#
# Learn more:
#   https://agentgateway.dev/docs/standalone/latest/integrations/llm/providers/bedrock/
#   https://kubernetes.io/docs/concepts/services-networking/network-policies/
#   https://kubernetes.io/docs/concepts/services-networking/service/
#   https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
apiVersion: v1
kind: Namespace
metadata:
  name: llm-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway
  namespace: llm-gateway
---
# agentgateway config: four model names, all served by Bedrock. The request's
# "model" field picks the entry. runtimeOnly always uses the Bedrock Runtime
# endpoint (the Converse API).
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: llm-gateway
data:
  config.yaml: |
    llm:
      port: 4000
      models:
      - name: claude
        provider: bedrock
        params:
          awsRegion: REPLACE_WITH_AWS_REGION
          model: REPLACE_WITH_DEFAULT_PROFILE
          bedrockEndpointPreference: runtimeOnly
      - name: claude-haiku
        provider: bedrock
        params:
          awsRegion: REPLACE_WITH_AWS_REGION
          model: REPLACE_WITH_HAIKU_PROFILE
          bedrockEndpointPreference: runtimeOnly
      - name: claude-sonnet
        provider: bedrock
        params:
          awsRegion: REPLACE_WITH_AWS_REGION
          model: REPLACE_WITH_SONNET_PROFILE
          bedrockEndpointPreference: runtimeOnly
      - name: claude-opus
        provider: bedrock
        params:
          awsRegion: REPLACE_WITH_AWS_REGION
          model: REPLACE_WITH_OPUS_PROFILE
          bedrockEndpointPreference: runtimeOnly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: llm-gateway }
  template:
    metadata:
      labels: { app: llm-gateway }
    spec:
      serviceAccountName: llm-gateway
      nodeSelector: { ate.dev/pool: system }
      # Tolerates the system group's taint (Auto Mode, setup-aws create cluster).
      tolerations: [{ key: ate.dev/workloadType, operator: Equal, value: ate-system-infra, effect: NoSchedule }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: agentgateway
        image: cr.agentgateway.dev/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
        args: ["-f", "/config/config.yaml"]
        env:
        - { name: RUST_LOG, value: info }
        # Never fall back to the node's instance role through IMDS: the only
        # credential this pod may use is its Pod Identity role.
        - { name: AWS_EC2_METADATA_DISABLED, value: "true" }
        ports:
        - { name: llm, containerPort: 4000 }
        readinessProbe:
          tcpSocket: { port: 4000 }
          periodSeconds: 5
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { memory: 512Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        volumeMounts:
        - { name: config, mountPath: /config, readOnly: true }
        - { name: tmp, mountPath: /tmp }
      volumes:
      - name: config
        configMap: { name: llm-gateway-config }
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: llm-gateway
spec:
  type: ClusterIP
  selector: { app: llm-gateway }
  ports:
  - { name: http, port: 80, targetPort: llm }
---
# Once a NetworkPolicy selects a pod, only the traffic it lists gets in: here
# atenet-egress in ate-system, and any pod in this namespace (podSelector {}).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-gateway-ingress
  namespace: llm-gateway
spec:
  podSelector: { matchLabels: { app: llm-gateway } }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ate-system } }
      podSelector: { matchLabels: { app: atenet-egress } }
    - podSelector: {}
    ports:
    - { port: 4000, protocol: TCP }
