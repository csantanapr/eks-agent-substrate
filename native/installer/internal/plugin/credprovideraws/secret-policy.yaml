# The credential provider's secret policy, a ConfigMap: which atespace may
# resolve which Secrets Manager secrets. It is default deny: an atespace that
# is not listed resolves nothing. The credprovider-aws plugin fills in the
# account and Region (${ACCOUNT}, ${AWS_REGION}) and applies it. The provider
# reads it only when it starts, so the plugin puts a hash of the filled-in
# text on the provider's pods, and a change rolls them.
#
# The account id goes into the cluster only, never into a tracked file.
#
# Learn more:
#   https://github.com/csantanapr/credprovider-aws-secret-manager
#   https://kubernetes.io/docs/concepts/configuration/configmap/
apiVersion: v1
kind: ConfigMap
metadata: { name: aws-sm-credential-provider-secret-policy, namespace: ate-system }
data:
  secret-policy.yaml: |
    # Default deny: ate-demo-credprovider-denied and every other atespace resolve nothing.
    policies:
    - atespace: ate-demo-credprovider
      allowedSecrets:
      - account: "${ACCOUNT}"
        region: ${AWS_REGION}
        namePrefix: ate/ate-demo-credprovider/
