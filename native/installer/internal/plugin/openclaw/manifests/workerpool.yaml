# WorkerPool for the OpenClaw agent actors on EKS, Agent Substrate v1.0.0
# (ate.dev/v1). Applied with `kubectl apply` by demo/eks/deploy-demo.sh, which
# substitutes the replica count. The ActorTemplate's workerSelector matches the
# workload label below.
#
# What changed from the v1alpha1 pool in ../workerpool.yaml:
#   - sandboxClass became sandboxClasses (exactly one entry). With no configRef
#     the pool follows the class default SandboxConfig, gvisor-default as
#     installed.
#   - The worker image is the released ateworker-gvisor, pinned by digest, and
#     must match the control plane release. No ko build of a local checkout.
#   - A worker can host several actors now, up to its capacity, which comes from
#     the worker container's limits below. The limits are sized for exactly one
#     2 GiB OpenClaw actor (manifests/eks/actortemplate.yaml), so the demo keeps
#     the one-actor-per-worker behavior the dashboard and the recording show.
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    workload: openclaw
spec:
  replicas: REPLACE_WITH_WORKER_REPLICAS
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0@sha256:f8987236c6256f58c4b2625e543b43f4ae4bdded6ee6821c03d966effb7c0f17
  sandboxClasses:
    - name: gvisor
  template:
    # The gVisor node group. Worker pods tolerate its ate.dev/sandboxClass taint
    # on their own, so no tolerations are listed here.
    nodeSelector:
      ate.dev/pool: gvisor
    # Capacity is read from the limits: one 1 CPU / 2 GiB actor plus the memory
    # the worker keeps for itself. Memory is not compressible, so its request
    # matches the limit; the CPU request is low so the pool packs onto nodes.
    resources:
      limits:
        cpu: "1"
        memory: 2560Mi
      requests:
        cpu: 250m
        memory: 2560Mi
