# The StorageClass for per-actor S3 Files volumes, on the same EFS CSI driver
# and CSIDriverConfig as demos/efs. provisioningMode s3files-ap: one S3 Files
# access point per volume, under basePath, owned by uid and gid.
# demos/s3files/deploy.sh fills it in and applies it.
#
# Placeholders, filled in by render_yaml (lib/common.sh):
#   SC                 the StorageClass name, s3files-ate
#   fs                 the S3 file system id
#   EFS_UID, EFS_GID   config.env
#
# Learn more:
#   https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-files-mounting-eks.html
#   https://github.com/agent-substrate/substrate/blob/v1.0.0-rc.3/docs/guides/csi-volumes.md

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ${SC}
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: s3files-ap
  fileSystemId: ${fs}
  directoryPerms: "700"
  uid: "${EFS_UID}"
  gid: "${EFS_GID}"
  basePath: /ate
reclaimPolicy: Delete
volumeBindingMode: Immediate
