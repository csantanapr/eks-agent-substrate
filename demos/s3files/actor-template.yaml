# The counter-s3files actor template: the counter demo with its data volume
# on Amazon S3 Files. demos/s3files/deploy.sh fills it in and creates it once
# in each counter atespace (gvisor and microvm), with kubectl ate --preview
# create actor-template. It is a Substrate ActorTemplate, not a Kubernetes
# object, so it has no apiVersion or kind. Templates are immutable, so the
# script skips one that exists.
#   volumes        data asks StorageClass SC for a new 1 GiB volume per actor
#                  (external.template): each actor gets its own S3 Files
#                  access point
#   volumeMounts   the counter sees that volume at /home/counter and writes
#                  its file counter there, so the count lands in the S3
#                  bucket, not in the snapshot
#
# Placeholders, filled in by render_yaml (lib/common.sh):
#   atespace, workload   ate-demo-counter and counter (gvisor), or
#                        ate-demo-counter-microvm and counter-microvm
#   COUNTER_IMAGE        the counter image in private ECR, pinned by digest
#   SC                   the StorageClass name, s3files-ate
# Inside { }, an unquoted placeholder has no braces (a dollar sign and the
# name), so this file parses as YAML before it is filled in too.
#
# Learn more:
#   https://github.com/agent-substrate/substrate/blob/v1.0.0-rc.3/docs/guides/csi-volumes.md
#   https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-files-mounting-eks.html

metadata: { atespace: $atespace, name: counter-s3files }
workerSelector: { matchLabels: { workload: $workload } }
containers:
- name: counter
  image: ${COUNTER_IMAGE}
  command: [/ko-app/counter]
  wakeupProbe: { httpGet: { path: /readyz, port: 80 } }
  volumeMounts: [{ name: data, mountPath: /home/counter }]
resources: { limits: { cpuMillicores: 1000, memoryBytes: 536870912 } }
snapshotConfig: { preferredFidelity: SNAPSHOT_FIDELITY_MEMORY }
volumes:
- name: data
  external: { template: { capacityBytes: 1073741824, storageClassName: $SC } }
