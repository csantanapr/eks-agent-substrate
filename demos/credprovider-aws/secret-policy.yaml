# The credential provider's secret policy, a ConfigMap: which atespace may
# resolve which Secrets Manager secrets. It is default deny: an atespace that
# is not listed resolves nothing. demos/credprovider-aws/deploy.sh fills it
# in and applies it. The provider reads it only when it starts, so the
# script puts a hash of the filled-in text on the provider's pods, and a
# change rolls them.
#
# Placeholders, filled in by render_yaml (lib/common.sh):
#   CP_POLICY_CM, CP_NS, CP_ATESPACE, CP_DENIED_ATESPACE
#               demos/credprovider-aws/lib.sh
#   ACCOUNT     the AWS account id, read from STS. It goes into the cluster
#               only, never into a tracked file.
#   AWS_REGION  config.env
# Inside { }, an unquoted placeholder has no braces (a dollar sign and the
# name), so this file parses as YAML before it is filled in too.
#
# The line starting with # inside secret-policy.yaml below is part of the
# policy text, so it gets filled in too.
#
# Learn more:
#   https://github.com/csantanapr/credprovider-aws-secret-manager
#   https://kubernetes.io/docs/concepts/configuration/configmap/

apiVersion: v1
kind: ConfigMap
metadata: { name: $CP_POLICY_CM, namespace: $CP_NS }
data:
  secret-policy.yaml: |
    # Default deny: ${CP_DENIED_ATESPACE} and every other atespace resolve nothing.
    policies:
    - atespace: ${CP_ATESPACE}
      allowedSecrets:
      - account: "${ACCOUNT}"
        region: ${AWS_REGION}
        namePrefix: ate/${CP_ATESPACE}/
